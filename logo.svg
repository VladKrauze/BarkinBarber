<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <defs>
    <radialGradient id="puffL" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0ece4"/>
      <stop offset="100%" stop-color="#d8d0c4"/>
    </radialGradient>
    <radialGradient id="puffL2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbf8f4"/>
      <stop offset="70%" stop-color="#ece4d8"/>
      <stop offset="100%" stop-color="#c9b8a0"/>
    </radialGradient>
  </defs>

  <!-- Badge mark -->
  <g transform="translate(10, 10)">
    <circle cx="60" cy="60" r="56" fill="#1f1a16" stroke="#c8923a" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="49" fill="none" stroke="#c8923a" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Topknot poms -->
    <circle cx="48" cy="28" r="11" fill="url(#puffL)" stroke="#b8a890" stroke-width="1"/>
    <circle cx="60" cy="24" r="13" fill="url(#puffL)" stroke="#b8a890" stroke-width="1"/>
    <circle cx="72" cy="28" r="11" fill="url(#puffL)" stroke="#b8a890" stroke-width="1"/>
    <!-- Topknot texture -->
    <circle cx="46" cy="26" r="1.5" fill="#d8d0c4" opacity="0.6"/>
    <circle cx="52" cy="30" r="1.2" fill="#d8d0c4" opacity="0.6"/>
    <circle cx="58" cy="22" r="1.5" fill="#d8d0c4" opacity="0.6"/>
    <circle cx="64" cy="26" r="1.2" fill="#d8d0c4" opacity="0.6"/>
    <circle cx="70" cy="22" r="1.5" fill="#d8d0c4" opacity="0.6"/>
    <circle cx="74" cy="30" r="1.2" fill="#d8d0c4" opacity="0.6"/>

    <!-- Bow -->
    <path d="M60 18 L54 14 L54 22 Z" fill="#b9602a" stroke="#8f4419" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M60 18 L66 14 L66 22 Z" fill="#b9602a" stroke="#8f4419" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="60" cy="18" r="2.5" fill="#8f4419"/>

    <!-- Head puff -->
    <ellipse cx="60" cy="52" rx="28" ry="26" fill="url(#puffL2)" stroke="#b8a890" stroke-width="1.5"/>
    <!-- Curly texture -->
    <circle cx="42" cy="46" r="3" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="50" cy="42" r="2.5" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="60" cy="40" r="3" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="70" cy="42" r="2.5" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="78" cy="46" r="3" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="38" cy="56" r="2.5" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="82" cy="56" r="2.5" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="44" cy="64" r="2" fill="#d8d0c4" opacity="0.4"/>
    <circle cx="76" cy="64" r="2" fill="#d8d0c4" opacity="0.4"/>

    <!-- Fluffy ears -->
    <ellipse cx="32" cy="56" rx="7" ry="16" fill="url(#puffL)" stroke="#b8a890" stroke-width="1.5" transform="rotate(-12 32 56)"/>
    <ellipse cx="88" cy="56" rx="7" ry="16" fill="url(#puffL)" stroke="#b8a890" stroke-width="1.5" transform="rotate(12 88 56)"/>
    <circle cx="30" cy="50" r="2" fill="#d8d0c4" opacity="0.5"/>
    <circle cx="34" cy="60" r="2" fill="#d8d0c4" opacity="0.5"/>
    <circle cx="90" cy="50" r="2" fill="#d8d0c4" opacity="0.5"/>
    <circle cx="86" cy="60" r="2" fill="#d8d0c4" opacity="0.5"/>

    <!-- Shaved snout -->
    <ellipse cx="60" cy="66" rx="14" ry="11" fill="#fbf8f4" stroke="#d4c8b8" stroke-width="1"/>

    <!-- Eyes -->
    <ellipse cx="51" cy="50" rx="3.5" ry="4" fill="#1f1a16"/>
    <ellipse cx="69" cy="50" rx="3.5" ry="4" fill="#1f1a16"/>
    <circle cx="52" cy="48.5" r="1.3" fill="#fbf8f4"/>
    <circle cx="70" cy="48.5" r="1.3" fill="#fbf8f4"/>

    <!-- Nose -->
    <ellipse cx="60" cy="60" rx="5" ry="4" fill="#1f1a16"/>
    <ellipse cx="58.5" cy="58.5" rx="1.5" ry="1" fill="#5b524a"/>
    <ellipse cx="57.8" cy="60.5" rx="0.8" ry="1.2" fill="#0a0807"/>
    <ellipse cx="62.2" cy="60.5" rx="0.8" ry="1.2" fill="#0a0807"/>

    <!-- Mouth -->
    <path d="M60 64 L60 68" stroke="#1f1a16" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M54 69 Q60 73 66 69" fill="none" stroke="#1f1a16" stroke-width="2" stroke-linecap="round"/>

    <!-- Badge text -->
    <text x="60" y="104" text-anchor="middle" font-size="9.5" fill="#c8923a" font-family="Georgia, serif" letter-spacing="2.5" font-weight="bold">BARKIN' BARBER</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150, 0)">
    <text x="0" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1a16">
      Barkin<tspan fill="#b9602a">'</tspan>
    </text>
    <text x="0" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1a16">
      Barber
    </text>
    <text x="2" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#8a8077" letter-spacing="3">
      MOBILE DOG GROOMING
    </text>
  </g>
</svg>
